name: Check

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/gradle-publish.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/gradle-publish.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  workflow_dispatch:

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: 25.0.5+8.0.LTS

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check
        run: ./gradlew check

      - name: Javadoc
        run: ./gradlew javadoc
